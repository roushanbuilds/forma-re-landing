  <meta name="twitter:card" content="summary">

  <!-- ============ Favicons ============ -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#3a3a3a">

  <style>
    /* ============ Fonts ============ */
    @font-face {
      font-family: "PP Telegraf";
      src: url("fonts/PPTelegraf-Regular.otf") format("opentype");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "PP Telegraf";
      src: url("fonts/PPTelegraf-Medium.otf") format("opentype");
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "PP Telegraf";
      src: url("fonts/PPTelegraf-SemiBold.otf") format("opentype");
      font-weight: 600; font-style: normal; font-display: swap;
    }

    /* ============ Base ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #bfaa8c;
      --gold-dark: #a8906e;
      --ink: #3f3f3f;
      --muted: #8a8a8a;
    }
    html, body { height: 100%; }
    body {
      font-family: "PP Telegraf", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      /* ---- BACKGROUND ----
         Soft, misty brand-toned gradient. To use a photo instead, replace the
         whole `background` line below with, e.g.:
           background: url("bg.jpg") center / cover no-repeat fixed;
         and drop bg.jpg into this folder. */
      background:
        radial-gradient(1200px 800px at 70% 20%, rgba(191,170,140,0.18), transparent 60%),
        radial-gradient(1000px 900px at 15% 90%, rgba(191,170,140,0.12), transparent 55%),
        linear-gradient(160deg, #f7f5f1 0%, #efece6 45%, #e7e2d9 100%);
      min-height: 100%;
    }

    /* ============ Layout ============ */
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .brand-icon {
      position: fixed; top: 26px; left: 28px;
      width: 40px; height: auto; opacity: 0.85;
    }
    .logo {
      width: min(250px, 54vw);
      height: auto;
      margin-bottom: 54px;
    }
    h1 {
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      letter-spacing: 0.14em;
      line-height: 1.08;
      text-transform: uppercase;
      color: var(--ink);
    }
    .subtitle {
      margin-top: 26px;
      max-width: 520px;
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      line-height: 1.7;
      letter-spacing: 0.02em;
      color: var(--muted);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    /* PP Telegraf Regular gives "E" a ~1px optical overshoot vs "R"; Medium
       (500) renders them equal height, so the brand name sits evenly. */
    .subtitle .brand-name { font-weight: 500; }
    /* ============ Countdown ============ */
    .countdown {
      display: flex;
      gap: clamp(24px, 6vw, 60px);
      margin-top: 50px;
    }
    .countdown .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 52px;
    }
    .countdown .num {
      font-weight: 400;
      font-size: clamp(2rem, 6.5vw, 3.4rem);
      line-height: 1;
      letter-spacing: 0.04em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .countdown .label {
      margin-top: 14px;
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .cta {
      display: inline-block;
      margin-top: 56px;
      padding: 16px 46px;
      background: var(--gold);
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      border-radius: 4px;
      box-shadow: 0 6px 20px rgba(191, 170, 140, 0.35);
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .cta:hover {
      background: var(--gold-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(168, 144, 110, 0.42);
    }

    /* ============ Socials ============ */
    .socials {
      display: flex;
      gap: 16px;
      margin-top: 56px;
    }
    .socials a {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      border: 1px solid rgba(63, 63, 63, 0.14);
      border-radius: 50%;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .socials a:hover {
      color: #fff;
      background: var(--gold);
      border-color: var(--gold);
      transform: translateY(-2px);
    }
    .socials svg { width: 18px; height: 18px; fill: currentColor; }
    /* Behance's "Bē" mark is wide & short; enlarge slightly so it reads at the
       same optical weight as the square Instagram/LinkedIn glyphs. */
    .socials a[aria-label="Behance"] svg { width: 24px; height: 24px; }

    footer {
      position: fixed; bottom: 20px; left: 0; right: 0;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <img class="brand-icon" src="assets/brand/icon.png" alt="">

  <main class="wrap">
    <img class="logo" src="assets/brand/logo.png" alt="FORMA RE">

    <h1>Under<br>Construction</h1>

    <p class="subtitle">
      Something new is taking shape.<br><span class="brand-name">FORMA&nbsp;RE</span> will be here shortly.
      Thank you for your patience.

    <!-- ============ Countdown ============ -->
    <div class="countdown" id="countdown" aria-live="off">
      <div class="unit"><span class="num" id="cd-days">00</span><span class="label">Days</span></div>
      <div class="unit"><span class="num" id="cd-hours">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="num" id="cd-mins">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="num" id="cd-secs">00</span><span class="label">Seconds</span></div>
    </div>

    <!-- TODO: change this to your real contact email -->
    <a class="cta" href="mailto:info@forma.re">Contact</a>

    </nav>
  </main>

  <footer>© <span id="yr"></span> FORMA RE®. All rights reserved.</footer>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ============ Countdown ============
    // Set your launch date/time here (ISO 8601). Include a timezone offset so it
    // counts down to the SAME moment for every visitor regardless of their location.
    //   e.g. "2026-09-01T09:00:00+02:00" (Sept 1 2026, 9am CEST)
    const LAUNCH_DATE = new Date("2026-09-12T09:00:00+02:00");

    const els = {
      days:  document.getElementById('cd-days'),
      hours: document.getElementById('cd-hours'),
      mins:  document.getElementById('cd-mins'),
      secs:  document.getElementById('cd-secs'),
    };
    const pad = n => String(n).padStart(2, '0');

    function tick() {
      let diff = Math.floor((LAUNCH_DATE - Date.now()) / 1000);
      if (diff < 0) diff = 0;
      els.days.textContent  = pad(Math.floor(diff / 86400));
      els.hours.textContent = pad(Math.floor(diff % 86400 / 3600));
      els.mins.textContent  = pad(Math.floor(diff % 3600 / 60));
      els.secs.textContent  = pad(diff % 60);
      if (diff === 0) clearInterval(timer);
    }
    tick();
    const timer = setInterval(tick, 1000);
  </script>
</body>
