  <style>
    /* ============ Fonts ============ */
    @font-face {
      font-family: "PP Telegraf";
      src: url("fonts/PPTelegraf-Regular.otf") format("opentype");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "PP Telegraf";
      src: url("fonts/PPTelegraf-Medium.otf") format("opentype");
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "PP Telegraf";
      src: url("fonts/PPTelegraf-SemiBold.otf") format("opentype");
      font-weight: 600; font-style: normal; font-display: swap;
    }

    /* ============ Base ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #bfaa8c;
      --gold-dark: #a8906e;
      --ink: #3f3f3f;
      --muted: #8a8a8a;
    }
    html, body { height: 100%; }
    body {
      font-family: "PP Telegraf", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      /* ---- BACKGROUND ----
         Soft, misty brand-toned gradient. To use a photo instead, replace the
         whole `background` line below with, e.g.:
           background: url("bg.jpg") center / cover no-repeat fixed;
         and drop bg.jpg into this folder. */
      background:
        radial-gradient(1200px 800px at 70% 20%, rgba(191,170,140,0.18), transparent 60%),
        radial-gradient(1000px 900px at 15% 90%, rgba(191,170,140,0.12), transparent 55%),
        linear-gradient(160deg, #f7f5f1 0%, #efece6 45%, #e7e2d9 100%);
      min-height: 100%;
    }

    /* ============ Layout ============ */
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .brand-icon {
      position: fixed; top: 26px; left: 28px;
      width: 40px; height: auto; opacity: 0.85;
    }
    .logo {
      width: min(250px, 54vw);
      height: auto;
      margin-bottom: 54px;
    }
    h1 {
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      letter-spacing: 0.14em;
      line-height: 1.08;
      text-transform: uppercase;
      color: var(--ink);
    }
    .subtitle {
      margin-top: 26px;
      max-width: 520px;
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      line-height: 1.7;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    /* ============ Countdown ============ */
    .countdown {
      display: flex;
      gap: clamp(18px, 5vw, 44px);
      margin-top: 48px;
    }
    .countdown .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 58px;
    }
    .countdown .num {
      font-weight: 600;
      font-size: clamp(1.9rem, 6vw, 3rem);
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .countdown .label {
      margin-top: 10px;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .cta {
      display: inline-block;
      margin-top: 100px;
      padding: 15px 42px;
      background: var(--gold);
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      border-radius: 2px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .cta:hover { background: var(--gold-dark); transform: translateY(-1px); }

    /* ============ Socials ============ */
    .socials {
      display: flex;
      gap: 26px;
      margin-top: 100px;
    }
    .socials a {
      color: var(--muted);
      transition: color 0.2s ease, transform 0.2s ease;
      display: inline-flex;
    }
    .socials a:hover { color: var(--gold-dark); transform: translateY(-2px); }
    .socials svg { width: 20px; height: 20px; fill: currentColor; }

    footer {
      position: fixed; bottom: 20px; left: 0; right: 0;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
  </style>
</head>

  <footer>© <span id="yr"></span> FORMA RE®. All rights reserved.</footer>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ============ Countdown ============
    // Set your launch date/time here (ISO 8601). Include a timezone offset so it
    // counts down to the SAME moment for every visitor regardless of their location.
    //   e.g. "2026-09-01T09:00:00+02:00" (Sept 1 2026, 9am CEST)
    const LAUNCH_DATE = new Date("2026-09-01T09:00:00+02:00");

    const els = {
      days:  document.getElementById('cd-days'),
      hours: document.getElementById('cd-hours'),
      mins:  document.getElementById('cd-mins'),
      secs:  document.getElementById('cd-secs'),
    };
    const pad = n => String(n).padStart(2, '0');

    function tick() {
      let diff = Math.floor((LAUNCH_DATE - Date.now()) / 1000);
      if (diff < 0) diff = 0;
      els.days.textContent  = pad(Math.floor(diff / 86400));
      els.hours.textContent = pad(Math.floor(diff % 86400 / 3600));
      els.mins.textContent  = pad(Math.floor(diff % 3600 / 60));
      els.secs.textContent  = pad(diff % 60);
      if (diff === 0) clearInterval(timer);
    }
    tick();
    const timer = setInterval(tick, 1000);
  </script>
